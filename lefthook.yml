pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yaml,yml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      exclude:
        - ".claude/skills/**"
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
