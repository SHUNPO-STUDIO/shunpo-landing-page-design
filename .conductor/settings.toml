"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
set -e
pnpm --version >/dev/null 2>&1 || npm install --global "$(node -p 'require("./package.json").packageManager')"
pnpm install --frozen-lockfile
if [ "$CONDUCTOR_IS_LOCAL" = "1" ]; then
  pnpm --filter @repo/web exec playwright install chromium
else
  pnpm --filter @repo/web exec playwright install --with-deps chromium
fi
"""
run_mode = "concurrent"

[scripts.run.dev]
available_in = ["local"]
command = "PORT=$CONDUCTOR_PORT STORYBOOK_PORT=$((CONDUCTOR_PORT + 1)) pnpm dev"
default = true
icon = "play"

[scripts.run.check]
command = "pnpm check"
icon = "shield-check"

[scripts.run.e2e]
available_in = ["local"]
command = "E2E_PORT=$((CONDUCTOR_PORT + 2)) pnpm test:e2e"
icon = "scan-eye"

[[preview_urls]]
name = "Site"
url = "http://localhost:$CONDUCTOR_PORT"

[[preview_urls]]
name = "Storybook"
url = "http://localhost:$((CONDUCTOR_PORT + 1))"
